# Terminology shared by every locale, in x18n's `glossary` shape, so the same file can feed
# x18n (UI strings) and diglot (docs). Locale-specific decisions that x18n cannot express
# (keep with a gloss, accepted variants) live in `<locale>/glossary.yml`.
