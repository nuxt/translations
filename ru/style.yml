rules:
  - "Address the reader as «вы». Use the imperative for instructions, for example «Добавьте», «Создайте», «Настройте»."
  - "Prefer a neutral, concise technical style. Avoid bureaucratic language, unnecessary introductory phrases and literal translations of English idioms."
  - "Do not use «мы» as a narrator when the English text uses “we” or “let's” to guide the reader through a step. Address the reader directly or use an impersonal construction. Keep «мы» when the Nuxt team is genuinely speaking as the author."
  - "Use sentence case in headings, titles and labels: capitalise only the first word and proper nouns."
  - "Keep code identifiers, API names, file and directory names, package names, configuration keys, CLI commands and paths unchanged."
  - "Do not translate product and technology names such as Nuxt, Vue, Nitro, Vite, TypeScript and DevTools."
  - "Use Russian quotation marks «ёлочки» for quoted prose. Use „лапки“ for a quotation inside another quotation."
  - "Use «ё» where it is standard and unambiguous; do not rewrite code, identifiers or source strings to introduce it."
  - "Keep list items within one list grammatically parallel."
  - "Preserve the meaning and level of certainty of the source. Do not add explanations, warnings or claims that are absent from the original."
  - "Prefer established Russian technical terminology, but keep a term in English when it is an API name, identifier or established product term."
  - "Translate for meaning rather than word order. Keep sentences readable and avoid overloading them with English syntax."
  - "Preserve Markdown structure, links, inline code, HTML, Vue components and all numbered placeholders exactly as required by Diglot validation."
